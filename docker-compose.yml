services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        # The same issuer and client as the API's (Compose reads them from .env).
        OKTA_ISSUER: ${OKTA_ISSUER:-}
        OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:-}
    ports:
      - "3000:3000"
    # Backstop for the extraction worker's memory checks (extract-text.ts); set the same cap on the deploy host.
    mem_limit: 1g
    env_file:
      - path: .env
        required: false
