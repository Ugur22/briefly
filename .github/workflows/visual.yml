name: visual

# Frontend PRs only: every screen at 400px and 1280px must pass axe and not scroll sideways.
# The screenshots are uploaded so a reviewer can look at the rendered result, not just the diff.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "libs/contracts/**"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: "true"

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run visual
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/e2e/screenshots/
          retention-days: 14
