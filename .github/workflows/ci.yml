name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t briefly-api .
      # Proves the bundled image boots and serves the contract, not just that it builds.
      # Placeholder config: health needs no Okta or Supabase, and the JWKS is only fetched on the first token.
      - run: |
          docker run -d --name api -p 3000:3000 \
            -e OKTA_ISSUER=https://okta.invalid/oauth2/default -e OKTA_AUDIENCE=api://briefly -e OKTA_CLIENT_ID=ci \
            -e SUPABASE_URL=https://supabase.invalid -e SUPABASE_PUBLISHABLE_KEY=ci \
            briefly-api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          docker logs api; exit 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so a key committed and later deleted is still found.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      # Applies every migration to a fresh Postgres, then runs the pgTAP suite against it.
      - run: bunx supabase db start
      - run: bunx supabase test db
